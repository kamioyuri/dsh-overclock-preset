# dsh-overclock-preset 的 bundle 补丁层。
#
# 只做一件事：把本插件作为一行挂进 profile 的条目列表。
# 预设本体（组装行列表 + persona）在 lib/preset.js，由 lib/index.js 在 apply 阶段
# 通过 ctx.agentPresets.register() 注册 —— 不是在 YAML 里插一行
# @deepseek-ai/dsh-agent-preset，原因见 lib/index.js 顶部注释（模块解析锚点）。
#
# 禁用本行 = 关闭插件 = 「超频模式」从预设选择器消失；部署默认预设不受影响。
- insert:
    - id: overclock-preset
      name: dsh-overclock-preset
